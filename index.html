 const fld=([key,label,type,options])=>`<label class="formfield"><span>${label}</span>${type==='select'?`<select name="${key}">${options.map(v=>`<option ${v===r[key]?'selected':''}>${esc(v)}</option>`).join('')}</select>`:type==='textarea'?`<textarea name="${key}" rows="5">${esc(r[key])}</textarea>`:`<input name="${key}" type="${type}" value="${esc(r[key])}" ${key==='id'&&old?'readonly':''} ${['id','title'].includes(key)?'required':''}>`}</label>`;
 document.getElementById('panel').innerHTML=`<div class="panelheader"><div><div class="eyebrow" style="color:var(--teal)">${esc(names[k])}</div><h2>${old?'Редактировать запись':'Внести данные'}</h2></div><button class="close" onclick="closePanel()">×</button></div><form id="recordform" onsubmit="saveRecord(event)"><div class="formgrid">${fields.map(fld).join('')}</div><div class="formactions"><button class="actionbtn" type="submit">Сохранить</button><button class="linkbtn" type="button" onclick="closePanel()">Отмена</button></div><p class="hint">Изменения сохраняются только в этом браузере. Для общей работы сотрудников потребуется серверная база данных и авторизация.</p></form>`;
 document.getElementById('overlay').classList.add('open');
}
function saveRecord(e){e.preventDefault();const f=new FormData(e.target);const data=Object.fromEntries(f.entries());for(const key of Object.keys(data))data[key]=String(data[key]).trim();if(!data.id||!data.title){alert('Заполните номер и описание события.');return;}const {key,original}=editing;const arr=journals[key];if(!original&&arr.some(r=>r.id===data.id)){alert('Такой номер уже существует.');return;}if(original){const i=arr.findIndex(r=>r.id===original);if(i>=0)arr[i]=data;}else arr.unshift(data);persist();closePanel();render();}

function closePanel(){document.getElementById("overlay").classList.remove("open")}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closePanel()});
function render(){nav();document.getElementById("crumb").textContent=state.page==="dashboard"?"Центр безопасности":names[state.page];document.getElementById("main").innerHTML=state.page==="dashboard"?renderDashboard():renderJournal();if(state.page!=="dashboard")updateTable()}
render();
</script></body></html>
